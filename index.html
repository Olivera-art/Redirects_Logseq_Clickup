<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Opening Logseq...</title>
</head>
<body style="font-family: sans-serif; text-align: center; padding-top: 20vh;">
  <p id="status">Opening Logseq...</p>
  <script>
    const target = decodeURIComponent(window.location.hash.slice(1));

    if (target && (target.startsWith('logseq-og://') || target.startsWith('logseq://'))) {
      window.location.href = target;
      document.getElementById('status').innerHTML =
        'Attempting to open Logseq.<br><br><a href="' + target + '">Click here if it did not open automatically</a>';
    } else {
      document.getElementById('status').textContent =
        'Invalid URL: Please make sure the link after # starts with logseq-og:// or logseq://.';
    }
  </script>
</body>
</html>
