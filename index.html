<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Opening App...</title>
</head>
<body style="font-family: sans-serif; text-align: center; padding-top: 20vh;">
  <p id="status">Opening App...</p>
  <script>
    const target = decodeURIComponent(window.location.hash.slice(1));
    const allowedSchemes = ['logseq-og://', 'logseq://', 'hook://'];

    if (target && allowedSchemes.some((scheme) => target.startsWith(scheme))) {
      window.location.href = target;
      document.getElementById('status').innerHTML =
        'Attempting to open target app.<br><br><a href="' + target + '">Click here if it did not open automatically</a>';
    } else {
      document.getElementById('status').textContent =
        'Invalid URL: Please make sure the link after # starts with a supported protocol (such as logseq://, logseq-og://, or hook://).';
    }
  </script>
</body>
</html>
